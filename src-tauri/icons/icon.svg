  <rect x="72" y="150" width="22" height="28" rx="6" fill="#60a5fa"/>
  <rect x="105" y="128" width="22" height="50" rx="6" fill="#2563eb"/>
  <rect x="138" y="104" width="22" height="74" rx="6" fill="url(#growth)"/>
  <rect x="174" y="116" width="42" height="40" rx="12" fill="#1e40af"/>
