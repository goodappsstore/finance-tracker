<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" fill="none">
  <title>Finance Tracker</title>
  <desc>A white wallet with rising blue and emerald balance bars on a rounded sapphire tile.</desc>
  <defs>
    <linearGradient id="tile" x1="32" y1="8" x2="224" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset=".45" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="wallet" x1="48" y1="82" x2="204" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
