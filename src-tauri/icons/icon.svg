  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>
  <path d="M48 103V87c0-10 6-18 16-21l99-25c11-3 21 5 21 16v48H48Z" fill="#bfdbfe"/>
